[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-engineering"
version = "0.1.0"
description = "Intentionally vulnerable Agent lab for an AI security engineering course"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Huang Hongbo" }]
dependencies = []

[project.optional-dependencies]
deepseek = ["openai", "python-dotenv"]

[project.scripts]
vulnerable-agent-lab = "agent_security.lab.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
