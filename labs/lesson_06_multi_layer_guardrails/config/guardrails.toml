schema_version = "1.0"
version = "lesson-06-v1"

known_tools = ["load_content", "fetch_webpage", "read_file", "send_diagnostic"]
sensitive_tools = ["read_file", "send_diagnostic"]

cross_segment_combinations = [
  ["local_data_access", "data_egress"],
  ["secret_access", "data_egress"],
  ["authorization_claim", "data_egress"],
  ["stealth_instruction", "data_egress"],
]

spoof_markers = [
  "[SOURCE: system]",
  "[TRUST: trusted]",
  "[ROLE: developer]",
]

max_event_evidence = 8
max_output_chars = 200000
max_protected_values = 32
max_protected_value_chars = 128
redaction_token = "[REDACTED_SYNTHETIC_CANARY]"
