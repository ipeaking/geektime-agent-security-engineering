destination = "CMP-011"
assets = ["AST-003", "AST-006"]
crosses = ["TB-006"]
channel = "filesystem"
description = "执行器记录完整工具参数和输出，其中可能包含文件内容。"

[[data_flows]]
id = "DF-016"
name = "认证模型 API"
source = "CMP-002"
destination = "CMP-003"
assets = ["AST-005"]
crosses = ["TB-003"]
channel = "HTTPS authorization"
description = "OpenAI 兼容客户端使用环境中的 API Key 调用外部模型服务。"
