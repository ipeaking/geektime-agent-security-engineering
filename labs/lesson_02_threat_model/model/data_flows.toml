[[data_flows]]
id = "DF-011"
name = "提交诊断数据"
source = "CMP-007"
destination = "CMP-010"
assets = ["AST-003"]
crosses = ["TB-005"]
channel = "HTTP POST"
description = "文件内容被发送到本地诊断接收器，形成受控外传副作用。"

[[data_flows]]
id = "DF-012"
name = "返回工具结果"
source = "CMP-004"
destination = "CMP-002"
assets = ["AST-002", "AST-003"]
crosses = ["TB-004"]
channel = "Python return"
description = "工具输出回到 Runtime，可能包含完整文件内容。"

[[data_flows]]
id = "DF-013"
name = "发送工具结果给模型"
source = "CMP-002"
destination = "CMP-003"
assets = ["AST-002", "AST-003"]
crosses = ["TB-003"]
channel = "HTTPS"
description = "Live Runtime 把 ToolResult 包装为 function_call_output 发回外部模型。"

[[data_flows]]
id = "DF-014"
