schema_version = "1.0"

[system]
id = "SYS-001"
name = "课程实验 Agent"
baseline_tag = "lesson-01-prompt-injection"
description = "对第一讲中可读取网页、读取合成文件并向本地诊断接收器发送数据的 Agent 建立威胁模型。"

[scope]
in_scope = [
  "CMP-001",
  "CMP-002",
  "CMP-003",
  "CMP-004",
  "CMP-005",
  "CMP-006",
  "CMP-007",
  "CMP-008",
  "CMP-009",
  "CMP-010",
  "CMP-011",
]
out_of_scope_topics = [
  "生产数据库和真实企业数据",
  "邮件系统与真实公网接收器",
  "MCP、RAG 和浏览器自动化的专属攻击面",
  "Sandbox、Policy Engine 和人工审批的具体实现",
]

[[assumptions]]
id = "ASM-001"
statement = "文件工具只能访问每次运行时生成的合成工作区，其中没有真实凭证。"

[[assumptions]]
id = "ASM-002"
statement = "诊断工具的目标在构造时固定为 127.0.0.1 上的本地实验接收器。"

[[assumptions]]
id = "ASM-003"
statement = "Live 模式调用第三方模型服务，模型行为可能随模型、提示词和运行次数变化。"

[[assumptions]]
id = "ASM-004"
statement = "ToolCall 只是模型提出的动作，不等于系统已经授权该动作。"

[[assumptions]]
id = "ASM-005"
statement = "当前执行器故意缺少任务级授权、资源 Scope、Policy Engine 和人工审批。"
