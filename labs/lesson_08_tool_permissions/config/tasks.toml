schema_version = "1.0"

[[tasks]]
id = "TASK-READ-DOCUMENT"
display_name = "读取文档"
allowed_roles = ["reader", "editor"]
allowed_tools = ["read_file"]
allowed_capabilities = ["READ"]

[[tasks]]
id = "TASK-EDIT-DOCUMENT"
display_name = "编辑文档"
allowed_roles = ["editor"]
allowed_tools = ["read_file", "write_file"]
