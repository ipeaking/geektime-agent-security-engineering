[[tasks]]
id = "TASK-BILLING"
display_name = "处理付款"
allowed_roles = ["billing_operator"]
allowed_tools = ["charge_payment"]
allowed_capabilities = ["PAYMENT", "NETWORK"]

[[tasks]]
id = "TASK-USER-ADMIN"
display_name = "管理用户"
allowed_roles = ["administrator"]
allowed_tools = ["manage_users"]
